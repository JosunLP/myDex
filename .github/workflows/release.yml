name: Release

# A tag like v1.2.3 builds all packages and creates a draft release.
# Publishing is done by hand after acceptance (docs/release/README.md).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      number: ${{ steps.v.outputs.number }}
    steps:
      - id: v
        shell: bash
        run: |
          name="${GITHUB_REF_NAME#v}"
          if [[ ! "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must be vX.Y.Z, but is $GITHUB_REF_NAME"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$name"
          # Increasing version code for Android (X.Y.Z → XXYYZZZ).
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "number=$((major * 100000 + minor * 1000 + patch))" >> "$GITHUB_OUTPUT"

  checks:
    name: Analysis and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze --fatal-infos packages tools
      - working-directory: apps/pokedex
        run: flutter analyze --fatal-infos
      - run: |
          for p in packages/domain packages/game_rules packages/application packages/catalog_store packages/user_store packages/sync tools/data_pipeline tools/sync_server; do
            (cd $p && dart test)
          done
      - working-directory: apps/pokedex
        run: flutter test

  android:
    name: Android
    needs: [version, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Provide signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MYDEX_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Secret MYDEX_KEYSTORE_BASE64 is missing (docs/release/README.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MYDEX_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        working-directory: apps/pokedex
        env:
          MYDEX_REQUIRE_SIGNING: 'true'
          MYDEX_KEYSTORE_PASSWORD: ${{ secrets.MYDEX_KEYSTORE_PASSWORD }}
          MYDEX_KEY_ALIAS: ${{ secrets.MYDEX_KEY_ALIAS }}
          MYDEX_KEY_PASSWORD: ${{ secrets.MYDEX_KEY_PASSWORD }}
          # Public key for catalog updates (ADR 0015), optional.
          MYDEX_CATALOG_KEY: ${{ secrets.MYDEX_CATALOG_PUBLIC_KEY }}
        shell: bash
        run: |
          for flavor in offline sync; do
            flutter build apk --release --flavor $flavor \
              --dart-define=MYDEX_CATALOG_KEY="$MYDEX_CATALOG_KEY" \
              --build-name ${{ needs.version.outputs.name }} \
              --build-number ${{ needs.version.outputs.number }}
          done
          ../../tools/ci/check_apk_permissions.sh \
            build/app/outputs/flutter-apk/app-offline-release.apk \
            build/app/outputs/flutter-apk/app-sync-release.apk
          mkdir -p ../../dist
          v=${{ needs.version.outputs.name }}
          cp build/app/outputs/flutter-apk/app-offline-release.apk ../../dist/mydex-$v-android.apk
          cp build/app/outputs/flutter-apk/app-sync-release.apk ../../dist/mydex-sync-$v-android.apk
      - name: Verify signature
        shell: bash
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          for apk in dist/*.apk; do
            "$apksigner" verify --print-certs "$apk" | tee -a dist/android-certificates.txt
          done
          if grep -q "CN=Android Debug" dist/android-certificates.txt; then
            echo "::error::Package is signed with the debug key."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  desktop:
    name: ${{ matrix.target }}
    needs: [version, checks]
    strategy:
      matrix:
        include:
          - { target: linux, os: ubuntu-latest }
          - { target: windows, os: windows-latest }
          - { target: macos, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build and package
        working-directory: apps/pokedex
        env:
          MYDEX_CATALOG_KEY: ${{ secrets.MYDEX_CATALOG_PUBLIC_KEY }}
        shell: bash
        run: |
          v=${{ needs.version.outputs.name }}
          flutter build ${{ matrix.target }} --release \
            --dart-define=MYDEX_CATALOG_KEY="$MYDEX_CATALOG_KEY" \
            --build-name $v --build-number ${{ needs.version.outputs.number }}
          mkdir -p ../../dist
          case "${{ matrix.target }}" in
            linux)
              tar -C build/linux/x64/release/bundle -czf ../../dist/mydex-$v-linux-x64.tar.gz .
              ;;
            windows)
              (cd build/windows/x64/runner/Release && 7z a -tzip "$GITHUB_WORKSPACE/dist/mydex-$v-windows-x64.zip" .)
              ;;
            macos)
              # Not notarized (no Apple developer account configured).
              app="$(ls -d build/macos/Build/Products/Release/*.app | head -1)"
              ditto -c -k --keepParent "$app" ../../dist/mydex-$v-macos.zip
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/

  sync-server:
    name: Sync server
    needs: [version, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        shell: bash
        run: |
          v=${{ needs.version.outputs.name }}
          mkdir -p dist/mydex-sync-server-$v
          dart build cli --target tools/sync_server/bin/sync_server.dart -o build/sync_server
          cp -r build/sync_server/bundle/. dist/mydex-sync-server-$v/
          cp tools/sync_server/README.md dist/mydex-sync-server-$v/
          tar -C dist -czf dist/mydex-sync-server-$v-linux-x64.tar.gz mydex-sync-server-$v
          rm -r dist/mydex-sync-server-$v
      - name: Sign catalog update
        env:
          SIGNING_KEY: ${{ secrets.MYDEX_CATALOG_SIGNING_KEY }}
        shell: bash
        run: |
          if [[ -z "$SIGNING_KEY" ]]; then
            echo "No MYDEX_CATALOG_SIGNING_KEY – no catalog update in this release."
            exit 0
          fi
          v=${{ needs.version.outputs.name }}
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/catalog.key"
          dart run tools/data_pipeline/bin/data_pipeline.dart sign-update \
            --key "$RUNNER_TEMP/catalog.key" --out "dist/catalog-update"
          rm "$RUNNER_TEMP/catalog.key"
          tar -C dist/catalog-update -czf dist/mydex-catalog-update-$v.tar.gz .
          rm -r dist/catalog-update
      - uses: actions/upload-artifact@v4
        with:
          name: sync-server
          path: dist/

  publish:
    name: Draft release
    needs: [version, android, desktop, sync-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum mydex-* > SHA256SUMS
      - name: Release notes
        shell: bash
        run: |
          v=${{ needs.version.outputs.name }}
          # The version's section from the CHANGELOG (up to the next heading).
          awk -v v="$v" '
            $0 ~ "^## \\[?" v "\\]?" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "Checksums: \`SHA256SUMS\`. Android certificate: \`android-certificates.txt\`."
            echo "\"mydex\" is the default edition without internet permission, \"mydex-sync\" contains the optional sync."
            if ls dist/mydex-catalog-update-* >/dev/null 2>&1; then
              echo "\"mydex-catalog-update\" is the signed catalog update for your own sync server (\`--catalog-dir\`)."
            fi
          } >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: myDex ${{ needs.version.outputs.name }}
          body_path: notes.md
          files: dist/*
