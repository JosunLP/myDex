name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  checks:
    name: Analyse und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Abhängigkeiten
        run: flutter pub get
      - name: Formatierung
        run: dart format --output=none --set-exit-if-changed packages tools apps/pokedex/lib apps/pokedex/test
      - name: Analyse (Pakete)
        run: dart analyze --fatal-infos packages tools
      - name: Analyse (App)
        working-directory: apps/pokedex
        run: flutter analyze --fatal-infos
      - name: Tests (Pakete)
        run: |
          for p in packages/domain packages/game_rules packages/application packages/catalog_store packages/user_store packages/sync tools/data_pipeline tools/sync_server; do
            (cd $p && dart test)
          done
      - name: Tests (App)
        working-directory: apps/pokedex
        run: flutter test

  catalog:
    name: Katalog reproduzierbar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Quellstand-Cache
        uses: actions/cache@v4
        with:
          path: .dart_tool/pokeapi
          key: pokeapi-${{ hashFiles('data/source_manifests/pokeapi.json') }}
      - run: flutter pub get
      - name: Katalog neu bauen
        run: dart run tools/data_pipeline/bin/data_pipeline.dart build
      - name: Eingecheckte Pakete stimmen überein
        run: git diff --exit-code -- apps/pokedex/assets/catalog data/fixtures

  build:
    name: Build ${{ matrix.target }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux, os: ubuntu-latest }
          - { target: apk, os: ubuntu-latest }
          - { target: windows, os: windows-latest }
          - { target: macos, os: macos-latest }
          - { target: ios, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        working-directory: apps/pokedex
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            ios) flutter build ios --debug --no-codesign ;;
            apk)
              flutter build apk --debug --flavor offline
              flutter build apk --debug --flavor sync
              ;;
            *) flutter build ${{ matrix.target }} --debug ;;
          esac
