name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  checks:
    name: Analyse und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Abhängigkeiten
        run: flutter pub get
      - name: Formatierung
        run: dart format --output=none --set-exit-if-changed packages apps/pokedex/lib apps/pokedex/test
      - name: Fixture ist aktuell
        run: |
          python3 tools/fixture_gen/generate_fixture.py
          cp data/fixtures/catalog.json apps/pokedex/assets/catalog/catalog.json
          git diff --exit-code -- data/fixtures apps/pokedex/assets
      - name: Analyse (Pakete)
        run: dart analyze --fatal-infos packages
      - name: Analyse (App)
        working-directory: apps/pokedex
        run: flutter analyze --fatal-infos
      - name: Tests (Pakete)
        run: |
          for p in domain game_rules application catalog_store user_store; do
            (cd packages/$p && dart test)
          done
      - name: Tests (App)
        working-directory: apps/pokedex
        run: flutter test

  build:
    name: Build ${{ matrix.target }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux, os: ubuntu-latest }
          - { target: apk, os: ubuntu-latest }
          - { target: windows, os: windows-latest }
          - { target: macos, os: macos-latest }
          - { target: ios, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        working-directory: apps/pokedex
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            ios) flutter build ios --debug --no-codesign ;;
            apk) flutter build apk --debug ;;
            *) flutter build ${{ matrix.target }} --debug ;;
          esac
