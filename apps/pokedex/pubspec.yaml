name: mydex_app
description: >-
  myDex – the private, offline-first Pokémon encyclopedia: the International
  Pokédex with the newest data plus every game, collection and teams.
publish_to: none
version: 1.0.0+100000
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^13.0.0
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  intl: any
  path_provider: ^2.1.0
  mydex_application: any
  mydex_catalog_store: any
  mydex_domain: any
  mydex_game_rules: any
  mydex_sync: any
  mydex_user_store: any
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
  assets:
    - assets/catalog/catalog.manifest.json
    - assets/catalog/catalog.sqlite.gz
    - assets/licenses/pokeapi.txt
    - assets/licenses/sprites.txt
    - assets/licenses/plus_jakarta_sans.txt
    - assets/licenses/jetbrains_mono.txt
    - assets/media/media.manifest.json
    - assets/media/media.sqlite.gz
